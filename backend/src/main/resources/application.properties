# Base H2 en mode fichier
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/potcommun;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console H2 accessible sur http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${SERVER_PORT:8080}

# JWT settings
jwt.secret=${JWT_SECRET:changeThisSecretToSomethingSecureChangeMe1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
