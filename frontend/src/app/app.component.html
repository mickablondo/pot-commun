<div class="page">
  <header>
    <h1>Pot Commun</h1>
    <p class="sous-titre">
      La jauge participative pour atteindre vos objectifs à plusieurs
    </p>
  </header>

  <app-jauge
    [declencheurRafraichissement]="compteurRafraichissement"
    (objectifRecupere)="surRecuperationObjectif()"
  ></app-jauge>

  <div class="grille">
    <app-ajout-gain (gainAjoute)="surAjoutGain()"></app-ajout-gain>

    <div class="carte">
      <h3>Ajouter un objectif</h3>
      <form [formGroup]="formulaireObjectif" (ngSubmit)="ajouterObjectif()">
        <div class="ligne">
          <label for="nom">Nom</label>
          <input
            id="nom"
            type="text"
            formControlName="nom"
            placeholder="Ex: PS5"
          />
        </div>
        <div class="ligne">
          <label for="prix">Prix (EUR)</label>
          <input id="prix" type="number" step="0.01" formControlName="prix" />
        </div>
        <button type="submit">Ajouter l'objectif</button>
      </form>
    </div>
  </div>

  <app-historique-objectifs></app-historique-objectifs>
</div>
